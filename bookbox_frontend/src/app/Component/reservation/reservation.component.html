<div class="page">
  <mat-card class="list-card bb-animate">
    <div class="list-header up-div">
      <div class="list-title">
        <div class="list-title-icon list-title-icon--reservation">
          <mat-icon>event_available</mat-icon>
        </div>
        <div>
          <h1>Reservations</h1>
          <p>Track user reservations.</p>
        </div>
      </div>
    </div>

    <mat-card-content>

      <div class="toolbar-row">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Filter reservations</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput type="text" placeholder="Search…" (keyup)="filterReservation($event)">
        </mat-form-field>

        <button class="bb-btn bb-btn--add" (click)="handleAddReservation()">
          <mat-icon>add</mat-icon>
          Add Reservation
        </button>
      </div>

      <div class="table-wrap">
        <table mat-table [dataSource]="dataSource" matSort class="bb-table">

          <ng-container matColumnDef="place">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
            <td mat-cell *matCellDef="let element">
              <span class="place-chip">
                <mat-icon>inventory_2</mat-icon>
                {{element.box.name}}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="user">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
            <td mat-cell *matCellDef="let element">
              <span class="user-chip">
                <mat-icon>mail_outline</mat-icon>
                {{element.user.email}}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantity</th>
            <td mat-cell *matCellDef="let element">
              <span class="qty-chip">{{element.reservationNb}}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <div class="row-actions">
                <button class="action-btn action-btn--edit" (click)="handleUpdateReservation(element)" matTooltip="Update">
                  <mat-icon>edit</mat-icon>
                </button>
                <button class="action-btn action-btn--delete" (click)="handleDeleteReservation(element)" matTooltip="Delete">
                  <mat-icon>delete_outline</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="display"></tr>
          <tr mat-row *matRowDef="let row; columns: display;" ></tr>

        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[5, 10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
