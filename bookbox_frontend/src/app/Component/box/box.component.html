<div class="page">
  <mat-card class="list-card bb-animate">
    <div class="list-header up-div">
      <div class="list-title">
        <div class="list-title-icon">
          <mat-icon>inventory_2</mat-icon>
        </div>
        <div>
          <h1>BookBoxes</h1>
          <p>Manage your book boxes.</p>
        </div>
      </div>
    </div>

    <mat-card-content>
      <div class="toolbar-row">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Filter boxes</mat-label>
          <mat-icon matPrefix>search</mat-icon>
          <input matInput type="text" placeholder="Search…" (keyup)="filterBox($event)">
        </mat-form-field>

        <button class="bb-btn bb-btn--add" (click)="handleAddBox()">
          <mat-icon>add</mat-icon>
          Add Box
        </button>
      </div>

      <div class="table-wrap">
        <table mat-table [dataSource]="dataSource" matSort class="bb-table">

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
          </ng-container>

          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Quantity</th>
            <td mat-cell *matCellDef="let element">
              <span class="qty-chip">{{element.quantity}}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="coordinates">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Location</th>
            <td mat-cell *matCellDef="let element">
              <span class="coord-chip" *ngIf="element.coordinates; else noCoord">
                <mat-icon>place</mat-icon>
                {{ element.coordinates?.latitude }} , {{ element.coordinates?.longitude }}
              </span>
              <ng-template #noCoord><span class="muted">—</span></ng-template>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let element">
              <div class="row-actions">
                <button class="action-btn action-btn--edit" (click)="handleUpdateBox(element)" matTooltip="Update">
                  <mat-icon>edit</mat-icon>
                </button>
                <button class="action-btn action-btn--delete" (click)="handleDeleteBox(element)" matTooltip="Delete">
                  <mat-icon>delete_outline</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="display"></tr>
          <tr mat-row *matRowDef="let row; columns: display;"></tr>

        </table>
      </div>

      <mat-paginator [pageSizeOptions]="[5, 10, 20, 50, 100]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
