<form class="form" [formGroup]="users">

  <div class="form-grid">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Name</mat-label>
      <mat-icon matPrefix>person_outline</mat-icon>
      <input matInput formControlName="name" placeholder="Enter the name" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Surname</mat-label>
      <mat-icon matPrefix>person_outline</mat-icon>
      <input matInput formControlName="surname" placeholder="Enter the surname" required>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Username</mat-label>
    <mat-icon matPrefix>alternate_email</mat-icon>
    <input matInput formControlName="username" placeholder="Enter the username" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Email</mat-label>
    <mat-icon matPrefix>mail_outline</mat-icon>
    <input matInput formControlName="email" type="email" placeholder="Email the email" required>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Password</mat-label>
    <mat-icon matPrefix>lock_outline</mat-icon>
    <input matInput formControlName="password" type="password" placeholder="Enter the password" required>
  </mat-form-field>

</form>
