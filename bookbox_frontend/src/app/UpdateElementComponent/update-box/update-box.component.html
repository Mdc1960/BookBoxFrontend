<div class="page">
  <mat-card class="form-card bb-animate">
    <div class="form-header up-div">
      <div class="form-header-icon form-header-icon--edit">
        <mat-icon>edit</mat-icon>
      </div>
      <div>
        <h1>Edit a Book Box</h1>
        <p>Update the information for the selected book box.</p>
      </div>
    </div>

    <mat-card-content>
      <app-box-form></app-box-form>

      <div class="form-actions">
        <button class="bb-btn bb-btn--ghost" type="button" routerLink="/load-box">
          <mat-icon>arrow_back</mat-icon>
          Cancel
        </button>
        <button class="bb-btn bb-btn--primary" type="button" (click)="updateBox()">
          <mat-icon>save</mat-icon>
          Save
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
