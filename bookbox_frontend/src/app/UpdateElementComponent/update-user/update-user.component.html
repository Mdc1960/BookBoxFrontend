<div class="page">
  <mat-card class="form-card bb-animate">
    <div class="form-header up-div">
      <div class="form-header-icon form-header-icon--edit">
        <mat-icon>manage_accounts</mat-icon>
      </div>
      <div>
        <h1>Edit User</h1>
        <p>Update the selected member's information.</p>
      </div>
    </div>

    <mat-card-content>
      <app-user-form-update></app-user-form-update>

      <div class="form-actions">
        <button class="bb-btn bb-btn--ghost" type="button" routerLink="/load-user">
          <mat-icon>arrow_back</mat-icon>
          Cancel
        </button>
        <button class="bb-btn bb-btn--primary" type="button" (click)="updateUser()">
          <mat-icon>save</mat-icon>
          Save
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
