<div class="page">
  <mat-card class="form-card bb-animate">
    <div class="form-header up-div">
      <div class="form-header-icon form-header-icon--user">
        <mat-icon>person_add_alt</mat-icon>
      </div>
      <div>
        <h1>Create a User</h1>
        <p>Add a new member to the community.</p>
      </div>
    </div>

    <mat-card-content>
      <app-user-form></app-user-form>

      <div class="form-actions">
        <button class="bb-btn bb-btn--ghost" type="button" routerLink="/load-user">
          <mat-icon>arrow_back</mat-icon>
          Annuler
        </button>
        <button class="bb-btn bb-btn--primary" type="button" (click)="createUser()">
          <mat-icon>check</mat-icon>
          Create
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
