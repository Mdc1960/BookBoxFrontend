<div class="page">
  <mat-card class="form-card bb-animate">
    <div class="form-header up-div">
      <div class="form-header-icon">
        <mat-icon>add_box</mat-icon>
      </div>
      <div>
        <h1>Create a New Box</h1>
        <p>Enter the book box details.</p>
      </div>
    </div>

    <mat-card-content>
      <app-box-form></app-box-form>

      <div class="form-actions">
        <button class="bb-btn bb-btn--ghost" type="button" routerLink="/load-box">
          <mat-icon>arrow_back</mat-icon>
          Cancel
        </button>
        <button class="bb-btn bb-btn--primary" type="button" (click)="createBox()">
          <mat-icon>check</mat-icon>
          Create Box
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
