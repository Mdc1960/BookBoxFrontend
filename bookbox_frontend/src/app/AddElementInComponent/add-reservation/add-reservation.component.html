<div class="page">
  <mat-card class="form-card bb-animate">
    <div class="form-header up-div">
      <div class="form-header-icon form-header-icon--reservation">
        <mat-icon>event_available</mat-icon>
      </div>
      <div>
        <h1>Create a Reservation</h1>
        <p>Reserve a Book Box for a User</p>
      </div>
    </div>

    <mat-card-content>
      <app-reservation-form></app-reservation-form>

      <div class="form-actions">
        <button class="bb-btn bb-btn--ghost" type="button" routerLink="/load-reservation">
          <mat-icon>arrow_back</mat-icon>
          Cancel
        </button>
        <button class="bb-btn bb-btn--primary" type="button" (click)="createReservation()">
          <mat-icon>check</mat-icon>
          Create
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
